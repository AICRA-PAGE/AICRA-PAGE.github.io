<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google Cross-Corpus Agentic RAG architecture</title>
  <desc id="desc">A five phase orchestration, search, sufficient context, iteration and synthesis workflow across multiple corpora.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93C5FD"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="72" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Cross-Corpus Agentic RAG</text>
  <text x="70" y="110" fill="#93C5FD" font-family="Arial, sans-serif" font-size="18">Sufficient Context Awareness + bounded retrieval loop</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="180" width="175" height="92" rx="14" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2"/>
    <text x="157" y="218" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">1. Orchestration</text>
    <text x="157" y="245" text-anchor="middle" fill="#DBEAFE" font-size="14">Plan + corpus route</text>

    <rect x="305" y="180" width="175" height="92" rx="14" fill="#0F766E" stroke="#5EEAD4" stroke-width="2"/>
    <text x="392" y="218" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">2. Search</text>
    <text x="392" y="245" text-anchor="middle" fill="#CCFBF1" font-size="14">Parallel fan-out</text>

    <rect x="540" y="160" width="220" height="132" rx="14" fill="#7C3AED" stroke="#C4B5FD" stroke-width="3"/>
    <text x="650" y="202" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">3. Sufficient Context</text>
    <text x="650" y="232" text-anchor="middle" fill="#EDE9FE" font-size="14">Question + snippets + draft</text>
    <text x="650" y="258" text-anchor="middle" fill="#DDD6FE" font-size="13">missing pieces / feedback</text>

    <rect x="820" y="180" width="145" height="92" rx="14" fill="#B45309" stroke="#FCD34D" stroke-width="2"/>
    <text x="892" y="218" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">4. Iterate</text>
    <text x="892" y="245" text-anchor="middle" fill="#FEF3C7" font-size="14">Rewrite query</text>

    <rect x="1025" y="180" width="120" height="92" rx="14" fill="#166534" stroke="#86EFAC" stroke-width="2"/>
    <text x="1085" y="218" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">5. Synthesis</text>
    <text x="1085" y="245" text-anchor="middle" fill="#DCFCE7" font-size="13">Grounded answer</text>
  </g>

  <g stroke="#93C5FD" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M245 226 H295"/>
    <path d="M480 226 H530"/>
    <path d="M760 226 H810"/>
    <path d="M965 226 H1015"/>
    <path d="M892 282 C892 360 650 360 650 304"/>
  </g>
  <text x="778" y="348" fill="#FCD34D" font-family="Arial, sans-serif" font-size="13">insufficient → targeted retry</text>

  <g font-family="Arial, sans-serif">
    <text x="70" y="410" fill="#CBD5E1" font-size="15" font-weight="700">CORPUS REGISTRY</text>
    <g transform="translate(70 432)">
      <rect width="240" height="88" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="20" y="34" fill="#F8FAFC" font-size="15">Finance Corpus</text>
      <text x="20" y="60" fill="#94A3B8" font-size="13">tenant · ACL · description</text>
    </g>
    <g transform="translate(345 432)">
      <rect width="240" height="88" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="20" y="34" fill="#F8FAFC" font-size="15">Project Corpus</text>
      <text x="20" y="60" fill="#94A3B8" font-size="13">provenance · version · hash</text>
    </g>
    <g transform="translate(620 432)">
      <rect width="240" height="88" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="20" y="34" fill="#F8FAFC" font-size="15">Security Corpus</text>
      <text x="20" y="60" fill="#94A3B8" font-size="13">freshness · classification</text>
    </g>
    <g transform="translate(895 432)">
      <rect width="250" height="88" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="20" y="34" fill="#F8FAFC" font-size="15">Evidence Ledger</text>
      <text x="20" y="60" fill="#94A3B8" font-size="13">claim · citation · audit trace</text>
    </g>
  </g>
  <text x="70" y="585" fill="#64748B" font-family="Arial, sans-serif" font-size="14">AICRA independent security analysis · official facts and implementation guidance are labeled separately</text>
</svg>
